[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sir9tui"
version = "1.1.0"
description = "sir9tui — Offline AI STEM Tutor by Nenifix. Textual TUI, quiz engine, progress tracking, LM Studio or offline mode."
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Godwin Appiah (Neni)", email = "info@nenifix.com"}
]
requires-python = ">=3.11"
dependencies = [
    "textual>=0.62",
    "rich>=13.3.3",
]

[project.scripts]
sir9tui = "sir9tui.main:main"

[tool.setuptools.packages.find]
include = ["sir9tui*"]
where = ["Desktop/neni9/sir9tui"]

[tool.setuptools.package-data]
"*" = ["*.tcss", "*.json", "*.db"]
